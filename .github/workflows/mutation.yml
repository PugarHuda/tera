# Mutation testing (StrykerJS) on the API's trust boundary: validate.ts, money.ts, csv.ts, share.ts. Each mutant is a
# small bug planted in the code; the Vitest suite must fail on it. A score under the break threshold fails the job.
name: Mutation testing

on:
  schedule:
    - cron: "30 3 * * *"
  pull_request:
    paths: ["src/lib/validate.ts", "src/lib/money.ts", "src/lib/csv.ts", "src/lib/share.ts", "src/lib/*.test.ts", "stryker.config.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker on the API trust boundary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx stryker run
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
