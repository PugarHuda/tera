# Real-user journeys (clicks, typing, file pick, download, Verify in Stripe) against every Vercel preview
# and production deploy, independent of TestSprite: e2e/user-journeys.mjs. The run video is kept as an artifact.
name: E2E user journeys

on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success'
    name: User journeys on the deployed app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node e2e/user-journeys.mjs "${{ github.event.deployment_status.environment_url }}" e2e-video
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-video
          path: e2e-video/*.webm
          retention-days: 14
