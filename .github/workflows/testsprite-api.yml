# The hand-written TestSprite API tests (testsprite/api/*.py: golden invoice contract, credit balance carry, 400/422
# rejections, Stripe parity evidence, platform headers) against the deployment under test: each PR's Vercel preview,
# production after a merge, and nightly. TestSprite gives backend tests no target URL, so
# scripts/testsprite-api-run.mjs stores each file with its BASE_URL pointing at the target, runs it, and puts the
# production URL back. 5 tests x 0.2 credits per run; with too few credits it runs nothing and says so.
name: TestSprite API

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

# The cloud tests' stored code is shared by every run: one run at a time, none cancelled half-way.
concurrency:
  group: testsprite-api
  cancel-in-progress: false

jobs:
  api-suite:
    name: TestSprite API tests (5, against the deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Wait for Vercel to deploy this commit, then pick the target
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -n "$BRANCH" ]; then
            for i in $(seq 1 60); do
              state=$(gh api "repos/${{ github.repository }}/commits/$SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
              [ "$state" = success ] && break
              [ "$state" = failure ] || [ "$state" = error ] && { echo "::error::Vercel deployment $state"; exit 1; }
              sleep 10
            done
            [ "$state" = success ] || { echo "::error::Vercel never finished deploying $SHA"; exit 1; }
            slug=$(echo "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g')
            url="https://tera-git-$slug-hudas-projects-a8e7f558.vercel.app"
          else
            url="https://tera-orpin-three.vercel.app"
          fi
          curl -sf "$url/api/openapi.json" -o /dev/null || { echo "::error::$url/api/openapi.json is not reachable"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: npm install -g @testsprite/testsprite-cli@0.15.0
      - name: Run the API tests
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: node scripts/testsprite-api-run.mjs "${{ steps.url.outputs.url }}"
