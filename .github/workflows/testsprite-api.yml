# Generated by `testsprite ci init github`, then scoped: the API suite (50 TestSprite
# backend tests: golden invoice contract, invariants, 400/422/404 validation) runs
# against PRODUCTION after every merge to main, nightly, and on demand.
# PR gating is done by the TestSprite GitHub App (UI suite against each Vercel preview);
# running this suite on pull_request would test prod, not the PR, so it is left out.
name: TestSprite API

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Back-to-back merges should not burn credits on a superseded commit.
concurrency:
  group: testsprite-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-suite:
    name: TestSprite API suite (production)
    runs-on: ubuntu-latest
    steps:
      - uses: TestSprite/testsprite-action@9f3ac52a42baae6c7099d1f89fa603b31d636d63 # v1.0.0
        with:
          api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          project: "065f775a-db05-4c9e-a4f4-bfd6605e7fd7"
          cli-version: "0.14.0"
          timeout: "900"
