# Schemathesis fuzzes the public API from its own OpenAPI spec (/api/openapi.json) in e2e.yml: schema-valid requests
# must be accepted and never 500, schema-invalid ones must be rejected, responses must match the spec.
# /api/parity and /api/stripe/* call Stripe and are left to their own tests.
[checks.positive_data_acceptance]
# A schema-valid timeline can still be one Stripe rejects or Tera does not model (a second subscribe, pause on a
# classic subscription): the documented 422. Events out of date order are a 400 JSON Schema cannot rule out.
expected-statuses = ["2XX", "400", "422"]
